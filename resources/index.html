<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>P5.js DaVinci Resolve Host</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }
    #canvas-root {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }
    #error-banner {
      display: none;
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      padding: 16px 20px;
      background: rgba(220, 38, 38, 0.92);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 14px;
      line-height: 1.5;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 999999;
      pointer-events: none;
      white-space: pre-wrap;
    }
    #error-banner .title {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
  <!-- Load local bundled p5.js -->
  <script src="p5.min.js"></script>
</head>
<body>
  <div id="canvas-root"></div>
  <div id="error-banner">
    <div class="title">JavaScript Error</div>
    <div id="error-message"></div>
  </div>

  <!-- Load deterministic clock and bridge shim -->
  <script src="p5_shim.js"></script>
</body>
</html>
